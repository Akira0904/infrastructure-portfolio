global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "linux_nodes"
    static_configs:
      - targets:
          - "192.0.2.10:9100"
          - "198.51.100.10:9100"

  # Example PostgreSQL exporter target.
  - job_name: "postgres"
    static_configs:
      - targets:
          - "192.0.2.20:9187"
