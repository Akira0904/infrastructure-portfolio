global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "linux_nodes"
    static_configs:
      - targets:
          - "10.10.20.10:9100"
          - "10.10.10.10:9100"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "10.10.20.20:9187"
