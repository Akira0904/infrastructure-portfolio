---
- name: Deploy Prometheus Node Exporter
  hosts: linux_servers
  become: true
  gather_facts: true

  tasks:
    - name: Create Node Exporter system user
      user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create Node Exporter download cache
      file:
        path: /var/cache/node_exporter
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Node Exporter archive
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "/var/cache/node_exporter/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        checksum: "sha256:{{ node_exporter_checksum }}"
        owner: root
        group: root
        mode: "0644"

    - name: Extract Node Exporter archive
      unarchive:
        src: "/var/cache/node_exporter/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: /var/cache/node_exporter
        remote_src: true
        creates: "/var/cache/node_exporter/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"

    - name: Install Node Exporter binary
      copy:
        src: "/var/cache/node_exporter/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart Node Exporter

    - name: Install Node Exporter systemd unit
      template:
        src: "{{ playbook_dir }}/templates/node_exporter.service.j2"
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Node Exporter

    - name: Ensure Node Exporter is enabled and started
      systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply pending handlers before validation
      meta: flush_handlers

    - name: Wait for Node Exporter port
      wait_for:
        host: 127.0.0.1
        port: "{{ node_exporter_port }}"
        timeout: 15

    - name: Check Node Exporter metrics endpoint
      uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        method: GET
        status_code: 200
        return_content: false

    - name: Get Node Exporter version
      command:
        cmd: /usr/local/bin/node_exporter --version
      register: node_exporter_version_output
      changed_when: false

    - name: Display installed Node Exporter version
      debug:
        var: node_exporter_version_output.stdout_lines

  handlers:
    - name: Restart Node Exporter
      systemd:
        name: node_exporter
        state: restarted
        enabled: true
        daemon_reload: true
